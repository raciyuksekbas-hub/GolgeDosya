# Yüksekbaş Belge — unified workspace.
#
# GEÇİCİ TEKNİK İSİM. "Yuksekbas-Belge" / "belge-shell" bir ürün markası değildir;
# marka kararı verilene kadar nötr bir çalışma adıdır.
#
# Bağımlılık invariant'ı (CI ile denetlenir, bkz. scripts/check-architecture.sh):
#     pdf-core -> document-core      SERBEST
#     document-core -> pdf-core      YASAK
[workspace]
resolver = "2"
members = [
    "apps/belge-shell/src-tauri",
    "crates/document-core",
    "crates/ekler-core",
    "crates/pdf-core",
    "crates/ikincigoz-core",
    "tools/preflight",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Dört uygulamanın beyan ettiği en yüksek değer (DüzenEk 1.88; Tavzih/İkinciGöz 1.77).
rust-version = "1.88"
license = "Proprietary"
authors = ["Raci Çetin Yüksekbaş"]

# Sürümler dört bağımsız uygulamanın BUGÜN çözdüğü sürümlere sabitlendi.
# Doğrulanma tarihi 2026-09-06; kaynak Cargo.lock'lar:
#   tauri 2.11.5 · wry 0.55.1 · tao 0.35.3 · zip 2.4.2 · quick-xml 0.36.2
#   image 0.25.10 · serde 1.0.229 · thiserror 1.0.69 · lopdf 0.34.0
# Bir sürümü yükseltmek migration'ın parçası DEĞİLDİR; ayrı bir iş olarak yapılır.
[workspace.dependencies]
# --- birleşik repo içindeki motorlar (canonical source) ---
# Bağımsız depolar dondurulmuş baseline olarak duruyor ama BUILD onlara bağlı
# değil: taze bir klon kendi başına derlenir.
tavzih-core = { path = "crates/document-core" }
ekler-core = { path = "crates/ekler-core" }
pdf-core = { path = "crates/pdf-core" }
ikincigoz-core = { path = "crates/ikincigoz-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
sha2 = "0.10"
base64 = "0.22"
# gif: Tavzih · tiff: DüzenEk — birleşik küme
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
lopdf = "0.34"
tiff = "0.9"
rayon = "1.12"
tempfile = "3"
regex = "1"
once_cell = "1"
libc = "0.2"
url = "2"
flate2 = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
