<!doctype html><html lang="tr" data-theme="dark"><head><meta charset="utf-8"><style>/*
 * Karşılaştır görünümünün stilleri.
 *
 * Bağımsız Değişikİş'in `src/styles.css` dosyasından alındı. Yerleşim, satır
 * hizalama, fark rayı ve diff işaretleme kuralları DEĞİŞTİRİLMEDİ: bunlar
 * kanıtlanmış görsel davranıştır ve migration sırasında yeniden tasarlanmaz.
 *
 * İki uyarlama yapıldı:
 *   1. Kök seçici `:root` yerine `.compare-root`. Böylece bu palet kabuğun
 *      geri kalanına sızmaz ve yalnız Karşılaştır bölümünde geçerlidir.
 *   2. Sabit koyu palet, kabuğun token'larına bağlandı (aşağıdaki blok).
 *      Bağımsız uygulama yalnız koyu temada çalışıyordu; birleşik kabuk
 *      kullanıcının açık/koyu tercihini izliyor ve Karşılaştır da izlemeli.
 *
 * Bir token eşleşmesi eksik kalırsa altındaki özgün değer yürürlükte kalır;
 * yani en kötü hâlde görünüm bağımsız uygulamadaki gibi olur, bozulmaz.
 */

/* ==========================================================================
   Değişikİş — Yüksekbaş LegalTech tasarım sistemi
   Bütün renk, yüzey, ölçü ve tipografi kararları bu token katmanından okunur.
   Aşağıdaki selektörler token dışında ham renk kullanmaz.
   ========================================================================== */

.compare-root {
  /*
   * Karşılaştır, taşındığında kendi tam tasarım sistemini yanında getirmişti:
   * kendi marka paleti (--brand-teal, --brand-coral), kendi yüzeyleri ve kendi
   * fontu (Manrope). Ürünün "dört uygulamanın yan yana dizilmiş hâli" gibi
   * hissettirmesinin en büyük tek sebebi buydu.
   *
   * Aşağıdaki adlar KORUNDU — altındaki ~700 kural değişmeden çalışıyor ve
   * diff motorunun görsel davranışı aynı kalıyor. Değişen tek şey, adların
   * artık ürünün kendi token'larına bağlanması. Karşılaştır artık ürüne ait.
   */

  /* Kendine atıf yapan bildirimler (`--surface-raised: var(--surface-raised)`)
     CSS'te döngüdür: değişken geçersiz olur ve onu okuyan her özellik sessizce
     düşer. Karşılaştır'ın sağ paneli bu yüzden diğer iki panelin aksine
     çerçevesiz ve zeminsiz çiziliyordu. Kabuk token'ı zaten miras alınıyor;
     yeniden bildirmeye gerek yok. */

  /* -- Yüzeyler ---------------------------------------------------------- */
  --surface-window: var(--surface-app);
  /* Belge yüzeyi kabuğun zeminidir. Koyu temada beyaz kâğıt hem okunmaz hem
     saatlerce metin okuyan kişiyi yorar; iki temada da chrome ile aynı aileden
     kalır. */
  --surface-document: var(--surface-app);
  --surface-shell: var(--surface-raised);
  --surface-panel: var(--surface-raised);
  --surface-pane-head: var(--surface-raised);
  --surface-inset: var(--surface-sunken);
  --surface-veil: rgb(0 0 0 / 22%);
  --surface-scrim: rgb(0 0 0 / 30%);
  --surface-translucent: var(--surface-hover);

  /* -- Çizgiler ---------------------------------------------------------- */
  --border-hairline: var(--border-subtle);
  --border-hover: var(--border-strong);

  /* -- Metin ------------------------------------------------------------- */
  --text-faint: var(--text-muted);
  --text-on-accent: var(--on-accent);

  /* -- Vurgu: ürünün tek mürekkep yeşili -------------------------------- */
  --accent-strong: var(--accent-hover);
  --accent-wash: var(--accent-quiet);
  --accent-line: var(--accent);
  --accent-glow: transparent;
  --accent-muted: var(--text-muted);
  --accent-chrome-wash: var(--accent-quiet);
  --accent-chrome-line: var(--border-strong);

  /* -- Fark renkleri ----------------------------------------------------- */
  /* Renk TEK taşıyıcı değildir: ChangeRail her farkı ayrıca +/− /değişti
     işaretiyle ve metin etiketiyle gösterir. Renk yalnız tarama hızını
     artırır. */
  --diff-added: var(--success);
  --diff-added-text: var(--success);
  --diff-added-wash: var(--success-quiet);
  --diff-added-line: var(--success);
  --diff-added-rest: var(--success-quiet);
  --diff-added-focus: var(--success-quiet);

  --diff-removed: var(--danger);
  --diff-removed-text: var(--danger);
  --diff-removed-wash: var(--danger-quiet);
  --diff-removed-line: var(--danger);
  --diff-removed-rest: var(--danger-quiet);
  --diff-removed-focus: var(--danger-quiet);

  --diff-modified: var(--review);
  --diff-modified-rest: var(--review-quiet);
  --diff-modified-wash: var(--review-quiet);

  --danger-text: var(--danger);
  --danger-wash: var(--danger-quiet);
  --danger-line: var(--danger);

  /* -- Ölçü -------------------------------------------------------------- */
  --radius-xs: 3px;
  --radius-md: var(--radius);
  --radius-pill: 999px;

  --sidebar-w: 232px;
  --topbar-h: var(--toolbar-h);
  --statusbar-h: 26px;

  /* -- Tipografi: sistem fontu. Manrope paketlenmiyordu zaten; adı yalnız
        yedek listesindeydi ve ürünün geri kalanıyla çelişiyordu. ---------- */
  --font-document: var(--font-ui);

  /* -- Yükselti: neredeyse görünmez ------------------------------------- */
  --shadow-toast: 0 4px 16px rgb(0 0 0 / 12%);
  --shadow-dialog: 0 8px 28px rgb(0 0 0 / 14%);

  --fast: var(--motion-fast);
}

/* == Çalışma alanı ========================================================= */
.compare-root .workspace { min-width: 0; min-height: 0; display: grid; background: var(--surface-window); }

.pane-header { flex: 0 0 34px; display: flex; align-items: center; gap: 9px; min-width: 0; padding: 0 12px; background: var(--surface-pane-head); border-bottom: 1px solid var(--border-hairline); }
.pane-side { flex: 0 0 auto; color: var(--text-faint); font-size: 8.5px; font-weight: 700; letter-spacing: .14em; }
.pane-file { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-muted); }
.pane-file strong { overflow: hidden; color: var(--text-primary); font-size: 11.5px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.pane-meta { flex: 0 0 auto; color: var(--text-faint); font-size: 9px; letter-spacing: .02em; }
.text-button { flex: 0 0 auto; margin-left: auto; padding: 4px 2px; color: var(--text-muted); border: 0; background: transparent; cursor: pointer; font-size: 10px; font-weight: 650; }
.text-button:hover { color: var(--text-primary); text-decoration: underline; }

/* == Belge yükleme ========================================================= */
.upload-zone { flex: 1; min-height: 0; margin: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 1px dashed var(--border-subtle); border-radius: var(--radius-md); background: var(--surface-inset); text-align: center; transition: border-color var(--fast), background var(--fast); }
.upload-zone.is-dragging { border-color: var(--accent); border-style: solid; background: var(--accent-wash); }
.upload-zone.has-error { border-color: var(--danger-line); }
.upload-icon { display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 14px; color: var(--accent-muted); border: 1px solid var(--accent-chrome-line); border-radius: var(--radius-md); background: var(--accent-chrome-wash); }
.upload-zone h2 { margin: 0; color: var(--text-primary); font-size: 13px; font-weight: 650; letter-spacing: -.01em; }
.upload-zone p { margin: 6px 0 16px; color: var(--text-muted); font-size: 11px; }
.file-types { margin-top: 13px; color: var(--text-faint); font-size: 8.5px; font-weight: 700; letter-spacing: .14em; }
.upload-hint { max-width: 260px; margin-top: 10px; color: var(--text-faint); font-size: 10px; line-height: 1.45; }
.inline-error { max-width: 340px; margin-top: 16px; padding: 9px 11px; color: var(--danger-text); border: 1px solid var(--danger-line); border-radius: var(--radius-sm); background: var(--danger-wash); font-size: 10.5px; line-height: 1.5; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 30px; padding: 0 15px; border: 0; border-radius: var(--radius-sm); cursor: pointer; font-size: 11.5px; font-weight: 650; transition: background var(--fast); }
.button:disabled { opacity: .34; cursor: not-allowed; }
.button.primary { color: var(--text-on-accent); background: var(--accent); }
.button.primary:hover:not(:disabled) { background: var(--accent-strong); }
.button.primary:active:not(:disabled) { background: var(--accent-hover); }

/* == Okuma yüzeyi ==========================================================
   Dikey alanın büyük bölümünü belge içeriği kaplar; çevresindeki krom
   olabildiğince ince tutulur. */
.document-scroll { position: relative; flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.paper { min-height: 100%; padding: 4px 0 72px; color: var(--text-primary); background: var(--surface-document); font-family: var(--font-document); font-size: 12.5px; line-height: 1.75; }

.document-row { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: start; padding: 9px 18px 9px 0; border-left: 2px solid transparent; scroll-margin: 80px 0; transition: background var(--fast), border-color var(--fast); }
.document-row.kind-added { border-left-color: var(--diff-added-rest); }
.document-row.kind-removed { border-left-color: var(--diff-removed-rest); }
.document-row.kind-modified { border-left-color: var(--diff-modified-rest); }

/* Fark düğümü: logodaki karşılaştırma düğümüyle aynı geometri. Ekleme ve silme
   dolu, değiştirme boş halka — üç tür renkten bağımsız olarak da ayrışır. */
.document-row.kind-added::before,
.document-row.kind-removed::before,
.document-row.kind-modified::before {
  position: absolute; top: 15px; left: 3px;
  width: 6px; height: 6px; border-radius: 50%; content: "";
  transition: background var(--fast), box-shadow var(--fast), transform var(--fast);
}
.document-row.kind-added::before { background: var(--diff-added-rest); }
.document-row.kind-removed::before { background: var(--diff-removed-rest); }
.document-row.kind-modified::before { background: var(--surface-document); box-shadow: inset 0 0 0 1.5px var(--diff-modified-rest); }

.row-gutter { padding-top: 3px; color: var(--text-faint); font-family: var(--font-mono); font-size: 9px; text-align: center; user-select: none; }
.row-content { min-width: 0; }
.row-.document-row.block-heading .row-body { color: var(--text-primary); font-size: 13px; font-weight: 700; letter-spacing: .005em; }
.document-row.block-article .row-body { font-weight: 550; }
.document-row.block-table .row-content { padding: 8px 10px; border: 1px solid var(--border-subtle); border-radius: var(--radius-xs); background: var(--surface-inset); font-size: 11px; }
.document-row.block-list .row-body::before { margin-right: 8px; color: var(--text-faint); content: "•"; }

/* Seçili değişiklik: renk değil yoğunluk artar — yüzey, kenar ve düğüm birlikte. */
.document-row.is-selected { z-index: 1; background: var(--surface-selected); box-shadow: inset 0 1px 0 var(--border-hairline), inset 0 -1px 0 var(--border-hairline); }
.document-row.is-selected.kind-added { border-left-color: var(--diff-added); }
.document-row.is-selected.kind-removed { border-left-color: var(--diff-removed); }
.document-row.is-selected.kind-modified { border-left-color: var(--diff-modified); }
.document-row.is-selected .row-gutter { color: var(--text-secondary); }
.document-row.is-selected::before { transform: scale(1.45); }
.document-row.is-selected.kind-added::before { background: var(--diff-added); }
.document-row.is-selected.kind-removed::before { background: var(--diff-removed); }
.document-row.is-selected.kind-modified::before { box-shadow: inset 0 0 0 2px var(--diff-modified); }

.fragment.added { padding: 1px 3px; color: var(--diff-added-text); border-radius: var(--radius-xs); background: var(--diff-added-wash); box-shadow: inset 0 -1px 0 var(--diff-added-line); }
.fragment.removed { padding: 1px 3px; color: var(--diff-removed-text); border-radius: var(--radius-xs); background: var(--diff-removed-wash); text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--diff-removed-line); }
.document-row.is-selected .fragment.added { background: var(--diff-added-focus); }
.document-row.is-selected .fragment.removed { background: var(--diff-removed-focus); }

.placeholder-copy { color: var(--text-muted); font-size: 10.5px; font-style: italic; line-height: 18px; }
.document-row.kind-added.block-placeholder .row-content,
.document-row.kind-removed.block-placeholder .row-content { display: flex; align-items: center; min-height: 24px; padding: 0 10px; border: 1px dashed var(--border-subtle); border-radius: var(--radius-sm); background: var(--surface-inset); }
.document-row.grouped-placeholder-continuation { display: none; }

/* == Merkezî fark rayı =====================================================
   Logodaki merkez hattının arayüzdeki karşılığı. Düğümler belge içindeki
   konuma göre yerleşir; tıklama ilgili değişikliği seçer. */
.change-rail { display: flex; flex-direction: column; min-width: 0; background: var(--surface-panel); border-right: 1px solid var(--border-hairline); border-left: 1px solid var(--border-hairline); }
.rail-head { flex: 0 0 34px; display: grid; place-items: center; background: var(--surface-shell); border-bottom: 1px solid var(--border-hairline); }
.rail-swap { display: grid; place-items: center; width: 26px; height: 24px; padding: 0; color: var(--text-secondary); border: 1px solid var(--border-hairline); border-radius: var(--radius-xs); background: var(--surface-raised); cursor: pointer; transition: color var(--fast), background var(--fast), border-color var(--fast); }
.rail-swap:hover:not(:disabled) { color: var(--text-primary); border-color: var(--accent-chrome-line); background: var(--surface-hover); }
.rail-swap:disabled { opacity: .3; cursor: not-allowed; }
.rail-body { position: relative; flex: 1; min-height: 0; }
.rail-step { position: absolute; z-index: 2; left: 50%; display: grid; place-items: center; width: 24px; height: 20px; padding: 0; color: var(--text-faint); border: 0; border-radius: var(--radius-xs); background: var(--surface-panel); cursor: pointer; transform: translateX(-50%); transition: color var(--fast), background var(--fast); }
.rail-step.up { top: 52px; }
.rail-step.down { bottom: 18px; }
.rail-step:hover:not(:disabled) { color: var(--text-primary); background: var(--surface-raised); }
.rail-step:disabled { opacity: .28; cursor: not-allowed; }
.rail-track { position: absolute; inset: 0; }
.rail-axis { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--border-subtle); transform: translateX(-50%); }
.rail-node { position: absolute; top: 0; left: 50%; display: grid; place-items: center; width: 34px; height: 20px; padding: 0; border: 0; background: transparent; cursor: pointer; transform: translate(-50%, -50%); transition: opacity var(--fast); }
.rail-node-index { display: grid; place-items: center; width: 28px; height: 17px; color: var(--text-muted); border-radius: var(--radius-xs); background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--border-subtle); font-family: var(--font-mono); font-size: 9px; font-variant-numeric: tabular-nums; transition: color var(--fast), background var(--fast), box-shadow var(--fast); }
.rail-node i { display: none; width: 5px; height: 5px; border-radius: 50%; background: var(--diff-modified-rest); }
.rail-node.added .rail-node-index { color: var(--diff-added-text); box-shadow: inset 0 0 0 1px var(--diff-added-rest); }
.rail-node.removed .rail-node-index { color: var(--diff-removed-text); box-shadow: inset 0 0 0 1px var(--diff-removed-rest); }
.rail-node.modified .rail-node-index { box-shadow: inset 0 0 0 1px var(--diff-modified-rest); }
.rail-node:hover .rail-node-index { background: var(--surface-hover); }
.rail-node.is-active { z-index: 3; }
.rail-node.is-active .rail-node-index { width: 32px; height: 19px; color: var(--text-on-accent); font-size: 9.5px; font-weight: 700; }
.rail-node.is-active.added .rail-node-index { background: var(--diff-added); box-shadow: 0 0 0 3px var(--diff-added-focus); }
.rail-node.is-active.removed .rail-node-index { background: var(--diff-removed); box-shadow: 0 0 0 3px var(--diff-removed-focus); }
.rail-node.is-active.modified .rail-node-index { color: var(--surface-shell); background: var(--diff-modified); box-shadow: 0 0 0 3px var(--diff-modified-wash); }
/* Görünür alanın dışındaki farklar numarasız birer işarete iner. */
.rail-node.is-offscreen { opacity: .3; }
.rail-node.is-offscreen .rail-node-index { display: none; }
.rail-node.is-offscreen i { display: block; }
.rail-node.is-offscreen.added i { background: var(--diff-added-rest); }
.rail-node.is-offscreen.removed i { background: var(--diff-removed-rest); }
.rail-position { position: absolute; z-index: 2; right: 0; bottom: 3px; left: 0; color: var(--text-faint); font-family: var(--font-mono); font-size: 8.5px; font-variant-numeric: tabular-nums; text-align: center; }

/* == Inspector ============================================================= */
/* Fark paneli — kabuğun sağ paneli içinde. Kendi çerçevesi ve başlığı yok;
   ölçüler ürünün token'larından gelir ve metin ölçeğini izler. */
.compare-root .inspector-total { margin: 0 0 var(--space-3); color: var(--text-secondary); }
.compare-root .inspector-total strong { color: var(--text-primary); font-size: var(--text-title); font-weight: 600; font-variant-numeric: tabular-nums; }

.compare-root .summary-legend { display: grid; gap: var(--space-1); padding: 0; margin: 0; list-style: none; }
.compare-root .summary-legend li { display: flex; align-items: center; gap: var(--space-2); min-height: 22px; }
.compare-root .summary-legend i { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--text-muted); }
.compare-root .summary-legend .added i { background: var(--diff-added); }
.compare-root .summary-legend .removed i { background: var(--diff-removed); }
.compare-root .summary-legend .modified i { background: var(--diff-modified); }
.compare-root .legend-label { flex: 1; color: var(--text-secondary); }
.compare-root .legend-count { color: var(--text-primary); font-variant-numeric: tabular-nums; }

.compare-root .inspector-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
.compare-root .filter-note { color: var(--text-secondary); font-size: var(--text-meta); }

.compare-root .inspector-detail {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-3);
  overflow: auto;
  max-height: 40vh;
  background: var(--surface-sunken);
  border-left: 2px solid var(--diff-modified);
  border-radius: var(--radius-sm);
}
.compare-root .inspector-detail.added { border-left-color: var(--diff-added); }
.compare-root .inspector-detail.removed { border-left-color: var(--diff-removed); }
.compare-root .inspector-detail.modified { border-left-color: var(--diff-modified); }
.compare-root .inspector-detail header { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.compare-root .inspector-detail header .change-location { margin-left: auto; }
.compare-root .detail-block { display: grid; gap: 2px; }
.compare-root .detail-block > span { color: var(--text-secondary); font-size: var(--text-label); font-weight: 600; letter-spacing: var(--tracking-label); }
.compare-root .detail-block p { margin: 0; color: var(--text-primary); }
.compare-root .detail-block.removed p { color: var(--diff-removed-text); }
.compare-root .detail-block.added p { color: var(--diff-added-text); }
.compare-root .detail-note { display: grid; gap: 2px; }

.compare-root .filters { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.compare-root .filters button {
  min-height: 24px;
  padding: 0 6px;
  color: var(--text-secondary);
  font-size: var(--text-meta);
  font: inherit;
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
}
.compare-root .filters button:hover { color: var(--text-primary); background: var(--surface-hover); }
.compare-root .filters button.is-active { color: var(--text-primary); font-weight: 500; background: var(--surface-selected); }

.compare-root .change-list { display: grid; gap: 1px; }
.compare-root .change-row {
  display: grid;
  gap: 2px;
  padding: var(--space-2);
  color: inherit;
  font: inherit;
  text-align: left;
  background: none;
  border: 0;
  border-left: 2px solid transparent;
  border-radius: var(--radius-sm);
}
.compare-root .change-row:hover { background: var(--surface-hover); }
.compare-root .change-row.is-active { background: var(--surface-selected); }
.compare-root .change-row.added { border-left-color: var(--diff-added); }
.compare-root .change-row.removed { border-left-color: var(--diff-removed); }
.compare-root .change-row-top { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.compare-root .change-no { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.compare-root .change-type { display: inline-flex; align-items: center; gap: 4px; color: var(--text-secondary); font-size: var(--text-meta); }
.compare-root .change-type i { width: 6px; height: 6px; border-radius: 2px; background: var(--text-muted); }
.compare-root .change-row.added .change-type i { background: var(--diff-added); }
.compare-root .change-row.removed .change-type i { background: var(--diff-removed); }
.compare-root .change-row.modified .change-type i { background: var(--diff-modified); }
.compare-root .change-location { margin-left: auto; color: var(--text-secondary); font-size: var(--text-meta); }
.compare-root .change-summary { display: grid; gap: 1px; color: var(--text-secondary); font-size: var(--text-meta); }
.compare-root .change-summary-more { color: var(--text-muted); }
.compare-root .filter-empty { padding: var(--space-3); color: var(--text-secondary); text-align: center; }



@media (max-width: 1180px) {
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .document-row { padding-right: 12px; }
}

/* Alçak pencerede seçili fark kutusu kısalır; liste yerini korur. */
@media (max-height: 760px) {
  .compare-root .inspector-detail { max-height: 30vh; }
}

/* Not: Buradaki eski "kabuk token'larına bağlama" bloğu kaldırıldı. Artık
 * yeniden bağlama dosyanın başında, tek yerde yapılıyor; bu ikinci blok eski
 * token adlarına (--bg-content, --text, --line) atıf yapıyordu ve o adlar
 * tasarım turunda kalktı. İki ayrı bağlama noktası zaten kaçınılmaz biçimde
 * ayrışırdı. */

/* -- Kabuk içindeki yerleşim --------------------------------------------- */
.compare-root {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.compare-panes {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 0;
}

/*
 * Düzenle — PDF çalışma alanının stilleri.
 *
 * Bağımsız DüzenEk'ten taşındı; görsel yeniden kompozisyon turunda ürünün
 * token'larına bağlandı. Ham piksel boşluk, `.card` kutusu, 12 px radius ve
 * sabit font boyutları kalktı: bu yüzey artık kabuğun geri kalanıyla aynı
 * ölçü ritmini kullanıyor.
 *
 * Yerleşim: sayfa şeridi | belge alanı. Araçlar sağ panelde (kabuk çiziyor),
 * kaydetme yardımcı barda. Önizleme davranışı — kuyruk, DPI, geometri —
 * değişmedi; burada yalnız kutular var.
 */

.pdf-root { display: flex; flex-direction: column; min-width: 0; height: 100%; }

/* -- Yerleşim: sayfa şeridi + belge alanı -------------------------------- */
.pdf-root .pdf-workspace-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  flex: 1;
  min-width: 0;
  min-height: 0;
}

/* Sayfa varken şerit açılır. Boşken sütun hiç çizilmez. */
.pdf-root .pdf-workspace-layout[data-pages="true"] {
  grid-template-columns: 132px minmax(0, 1fr);
}

/* -- Sayfa şeridi --------------------------------------------------------- */
.pdf-root .thumbnail-list {
  min-width: 0;
  overflow: auto;
  padding: var(--space-3);
  background: var(--surface-sunken);
  border-right: 1px solid var(--border-subtle);
}
.pdf-root .thumbnail {
  padding: var(--space-1);
  margin-bottom: var(--space-3);
  border: 1px solid transparent;
  border-radius: var(--radius);
  font-size: var(--text-label);
  text-align: center;
}
.pdf-root .thumbnail.current { border-color: var(--accent); }
.pdf-root .thumbnail.selected { background: var(--surface-selected); }
.pdf-root .thumbnail.removed { opacity: 0.5; }
.pdf-root .thumbnail-image-button {
  display: block;
  width: 100%;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: var(--radius-sm);
}
.pdf-root .thumbnail-no {
  display: block;
  padding-top: var(--space-1);
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.pdf-root .thumbnail-pick {
  display: flex;
  gap: 4px;
  align-items: center;
  justify-content: center;
  padding-top: 2px;
  color: var(--text-secondary);
}
.pdf-root .thumbnail-move { display: flex; justify-content: center; }

/* -- Belge alanı ---------------------------------------------------------- */
.pdf-root .pdf-preview-panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

/* Belgenin üstündeki kompakt şerit: günlük sayfa araçları, döndürme, zoom. */
.pdf-root .pdf-strip {
  display: flex;
  flex: none;
  gap: var(--space-3);
  align-items: center;
  min-height: 40px;
  padding: 0 var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
}
.pdf-root .tool-segment {
  display: flex;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
}
.pdf-root .segment {
  min-height: 24px;
  padding: 0 var(--space-3);
  color: var(--text-secondary);
  font: inherit;
  background: var(--surface-hover);
  border: 0;
  transition: background var(--motion-fast) var(--ease);
}
.pdf-root .segment + .segment { border-left: 1px solid var(--border-subtle); }
.pdf-root .segment:hover:not(:disabled) { color: var(--text-primary); }
.pdf-root .segment[aria-pressed="true"] {
  color: var(--text-primary);
  font-weight: 500;
  background: var(--surface-selected);
  box-shadow: inset 0 -2px 0 var(--accent);
}
.pdf-root .segment:disabled { color: var(--text-muted); }
.pdf-root .zoom { display: flex; gap: var(--space-2); align-items: center; color: var(--text-secondary); }

.pdf-root .status { margin: var(--space-3) var(--space-4) 0; white-space: pre-wrap; }

.pdf-root .pdf-canvas {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  padding: var(--space-4);
}
.pdf-root .page-line { flex: none; margin: 0 0 var(--space-3); color: var(--text-secondary); }
.pdf-root .pdf-page-viewport {
  flex: 1;
  min-width: 0;
  min-height: 0;
  overflow: auto;
  background: var(--surface-sunken);
  border-radius: var(--radius);
}
.pdf-root .preview-note {
  flex: none;
  max-width: var(--measure);
  margin: var(--space-3) 0 0;
  color: var(--text-secondary);
  font-size: var(--text-meta);
}
/* -- Önizleme sahnesi (geometri davranışı değişmedi) --------------------- */
.pdf-root .pdf-preview-stage {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-2);
}
.pdf-root .pdf-thumbnail-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 130px;
}
.pdf-root .pdf-page-surface { position: relative; flex: none; background: var(--surface-document); }
.pdf-root .pdf-page-surface img { position: absolute; top: 50%; left: 50%; display: block; max-width: none; max-height: none; }

/* -- Araç paneli (kabuğun sağ paneli içinde) ----------------------------- */
.pdf-root .pdf-controls { min-width: 0; overflow-wrap: anywhere; }
.pdf-root .tool-group + .tool-group { margin-top: var(--space-4); }
.pdf-root .tool-group > .inspector-label { margin: 0 0 var(--space-2); }
.pdf-root .tool-group > summary {
  padding: var(--space-1) 0;
  color: var(--text-secondary);
  font-size: var(--text-label);
  font-weight: 600;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}
/* Katlı grup kapalıyken hemen altındaki bölüm etiketine yapışıyordu. */
.pdf-root details.tool-group { margin-bottom: var(--space-4); }
.pdf-root .tool-grid { display: grid; gap: 1px; }
/* Araç satırı, dolgulu bir düğme değil sakin bir liste satırıdır: üç tanesi
   yan yana durduğunda panelin en ağır öğesi olmamalı. Kenar çubuğundaki kip
   satırıyla aynı dil — tonal seçim, solda ince vurgu işareti. */
.pdf-root .tool {
  position: relative;
  justify-content: flex-start;
  min-height: var(--row-h);
  padding: 0 var(--space-2);
  color: var(--text-secondary);
  font-weight: 400;
  text-align: left;
  white-space: normal;
  background: none;
  border-color: transparent;
}
.pdf-root .tool:hover:not(:disabled) { color: var(--text-primary); background: var(--surface-hover); border-color: transparent; }
.pdf-root .tool.is-current {
  color: var(--text-primary);
  font-weight: 500;
  background: var(--surface-selected);
  border-color: transparent;
}
.pdf-root .tool.is-current::before {
  content: "";
  position: absolute;
  top: 7px;
  bottom: 7px;
  left: 0;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
}
.pdf-root .tool-name { margin: 0; font-weight: 500; }
.pdf-root .tool-hint { margin: var(--space-1) 0 0; color: var(--text-secondary); font-size: var(--text-meta); }
.pdf-root .tool-count { margin: var(--space-3) 0 var(--space-2); color: var(--text-secondary); font-size: var(--text-meta); }
.pdf-root .pdf-controls label {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  align-items: center;
  margin: var(--space-3) 0;
  color: var(--text-secondary);
}
.pdf-root .pdf-controls select,
.pdf-root .pdf-controls input:not([type="checkbox"]) { max-width: 100%; }
.pdf-root .source-list {
  padding: 0;
  margin: var(--space-3) 0 0;
  list-style: none;
}
.pdf-root .source-list li {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  justify-content: space-between;
  min-height: 26px;
  color: var(--text-secondary);
}
.pdf-root .source-list li > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdf-root .approval {
  align-items: flex-start;
  font-size: var(--text-meta);
  line-height: 1.45;
}
.pdf-root .approval input { flex-shrink: 0; margin-top: 2px; }

/* Dar pencerede sayfa şeridi daralır; belge alanı korunur. */
@media (max-width: 1099px) {
  .pdf-root .pdf-workspace-layout[data-pages="true"] { grid-template-columns: 108px minmax(0, 1fr); }
}

/*
 * GölgeDosya — görsel dil.
 *
 * Apple'ın masaüstü disiplini, Japon tasarımının ölçülülüğü. Taklit değil:
 * Apple'dan hiyerarşi ve native davranış, Japon tasarımından boşluğun bilgi
 * taşıması ve süsün yokluğu alınır.
 *
 *   Ma      — boşluk bilgi mimarisinin parçası; ne sıkışık ne savruk
 *   Kanso   — bilgi, eylem veya yön üretmeyen öğe kaldırılır
 *   Shibui  — sessiz premium; incelik kullandıkça fark edilir
 *   Seijaku — saatlerce belge işi yapan kişiye sakinlik veren ritim
 *
 * Yasak: gradient, cam, neon, kalın gölge, kart yığını, renkli rozet çöplüğü,
 * 16-20px radius'lu dev kutular, pazarlama başlıkları.
 *
 * Marka: GölgeDosya (brand/BRAND.md). Sumi zemin, kâğıt yüzey, pirinç vurgu.
 *
 * Aile: NöbetçiTakvim ile aynı tasarım ekibinden çıkmış gibi durur — kenar
 * çubuğu yoğunluğu, hairline ayırıcılar, BÜYÜK HARF grup etiketi, içeriden
 * yerleşik sağ panel, kompakt buton, 4/6/8 radius. Ama merkezde zaman değil
 * belge vardır. Ölçüm ve tercüme: docs/design/01-referans-analizi.md
 *
 * Üç tema karakteri (kullanıcıya tema adı olarak GÖSTERİLMEZ; iç referans):
 *   Kanso — açık yüzeyler      Sumi — koyu mürekkep      Fuji — soğuk nötr
 */

:root {
  --text-scale: 1;

  /* ---------------------------------------------------------------- Kanso
     Saf beyaz değil. Hafif sıcak nötr bir chrome; belge yüzeyi ondan daha
     açık. Sepia/parşömen değil — modern ve hassas. */
  --surface-app: #ebeae7;
  --surface-sidebar: #e6e5e1;
  --surface-workspace: #f3f2ef;
  --surface-raised: #fbfbfa;
  --surface-document: #ffffff;
  --surface-sunken: #e2e1dd;
  --surface-hover: rgb(0 0 0 / 4%);
  --surface-selected: rgb(0 0 0 / 6%);

  /* Sumi tonlu metin — saf siyah değil, mürekkep. */
  --text-primary: #1c1c1e;
  --text-secondary: #6b6b70;
  --text-muted: #929297;

  --border-subtle: rgb(0 0 0 / 9%);
  --border-strong: rgb(0 0 0 / 16%);

  /* Tek vurgu: eskitilmiş pirinç — markanın "kat" rengi (brand/BRAND.md).
     Mavi-SaaS tonu değil, petrol yeşili değil. Her yerde değil: seçili
     navigasyon, birincil eylem, aktif durum, küçük durum işaretleri. */
  --accent: #8a6a3e;
  --accent-hover: #75592f;
  --accent-quiet: rgb(138 106 62 / 10%);
  --on-accent: #ffffff;

  /* Semantik. Hiçbir anlam YALNIZ renkle verilmez; işaret ve etiket eşlik eder. */
  --danger: #a8322a;
  --danger-quiet: rgb(168 50 42 / 9%);
  --warning: #8a5a12;
  --warning-quiet: rgb(138 90 18 / 10%);
  --review: #2c5a86;
  --review-quiet: rgb(44 90 134 / 9%);
  --success: #2b6446;
  --success-quiet: rgb(43 100 70 / 9%);

  --focus: #0a84ff;

  /* ------------------------------------------------------------- Ölçü ritmi
     4'ün katları. Ma: boşluk keyfî değil, ölçülü. */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* Küçük radius: masaüstü aleti, yuvarlak kart değil. */
  --radius-sm: 4px;
  --radius: 6px;
  --radius-lg: 8px;

  /* Tipografi — macOS sistem fontu. Yeni font paketlenmez. */
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
    system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

  --text-title: calc(20px * var(--text-scale));
  --text-heading: calc(15px * var(--text-scale));
  --text-body: calc(13px * var(--text-scale));
  --text-meta: calc(12px * var(--text-scale));
  /* BÜYÜK HARF grup ve panel etiketi — en küçük boy, aralıklı. */
  --text-label: calc(11px * var(--text-scale));
  --tracking-label: 0.06em;

  /* Hareket: dikkat istemez, durumu anlatır. Spring/bounce yok. */
  --motion-fast: 120ms;
  --motion: 180ms;
  --ease: cubic-bezier(0.32, 0.08, 0.24, 1);

  /* Kabuk ölçüleri. Dört yüzeyin dört yoğunluğu: kenar çubuğu ve bar kompakt,
     workspace ferah, panel orta. Referans oranlarından tercüme edildi. */
  --sidebar-w: 232px;
  --inspector-w: 300px;
  --inspector-inset: 12px;
  --toolbar-h: calc(48px * var(--text-scale));
  /* Örtüşük başlık çubuğu: trafik ışıklarının kapladığı üst bant. */
  --titlebar-h: 52px;
  /* Satır ve kontrol yükseklikleri metin ölçeğiyle büyür; sabit px 28 px'lik
     kutuya %200 metin sığdırmaya çalışırdı. Hepsi min-height olarak kullanılır. */
  --row-h: calc(32px * var(--text-scale));
  --control-h: calc(28px * var(--text-scale));

  /* Okunabilir ölçü — uzun açıklama metni bu genişliği aşmaz. */
  --measure: 62ch;
}

/* ------------------------------------------------------------------- Sumi
   Gerçek siyah değil, çok koyu sumi. Yüzeyler arasında yalnız hafif ton farkı;
   beyaz yerine yumuşak açık gri metin. Belge yüzeyi beyaz kalır ve chrome'dan
   net ayrılır. */
:root[data-theme="dark"] {
  --surface-app: #1c1c1e;
  --surface-sidebar: #1f1f21;
  --surface-workspace: #171719;
  --surface-raised: #232326;
  --surface-document: #ffffff;
  --surface-sunken: #131315;
  --surface-hover: rgb(255 255 255 / 6%);
  --surface-selected: rgb(255 255 255 / 9%);

  --text-primary: #ececee;
  --text-secondary: #9d9da3;
  --text-muted: #76767c;

  --border-subtle: rgb(255 255 255 / 9%);
  --border-strong: rgb(255 255 255 / 17%);

  --accent: #c9a472;
  --accent-hover: #d8b688;
  --accent-quiet: rgb(201 164 114 / 14%);
  --on-accent: #1c1610;

  --danger: #f08a80;
  --danger-quiet: rgb(240 138 128 / 13%);
  --warning: #e0b070;
  --warning-quiet: rgb(224 176 112 / 13%);
  --review: #86b4de;
  --review-quiet: rgb(134 180 222 / 13%);
  --success: #7dc09b;
  --success-quiet: rgb(125 192 155 / 13%);

  --focus: #4a9eff;
}

/* Yüksek kontrast: sınırlar gerçek renge, ikincil metin ana metne çıkar. */
:root[data-contrast="more"] {
  --border-subtle: currentColor;
  --border-strong: currentColor;
  --text-secondary: var(--text-primary);
  --text-muted: var(--text-primary);
}

:root[data-motion="reduced"] *,
:root[data-motion="reduced"] *::before,
:root[data-motion="reduced"] *::after {
  animation-duration: 1ms !important;
  transition-duration: 1ms !important;
  scroll-behavior: auto !important;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }

body {
  background: var(--surface-app);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: var(--text-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  cursor: default;
}

/* Kabuk metni seçilebilir değil — native uygulama hissi. Belge içeriği
   gösteren yüzeyler bunu kendi içinde geri açar. */
body { user-select: none; -webkit-user-select: none; }
.selectable { user-select: text; -webkit-user-select: text; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-2) var(--space-4);
  background: var(--accent);
  color: var(--on-accent);
  border-radius: 0 0 var(--radius) 0;
}
.skip-link:focus { left: 0; }

/*
 * GölgeDosya — kabuk ve ortak ilkeller.
 *
 * Buradaki her sınıf birden çok kipte kullanılır. Bir kipte tek kullanılan
 * görünüm buraya değil, o kipin kendi dosyasına aittir.
 *
 * Dört yüzey, dört yoğunluk (docs/design/01-referans-analizi.md):
 *   kenar çubuğu  kompakt   32px satır, 12px dolgu
 *   yardımcı bar  kompakt   48px, tek satır, sayfa başlığı taşımaz
 *   workspace     ferah     28–40px dolgu, başlık içeriğin parçası
 *   sağ panel     orta      içeriden yerleşik, hairline çerçeve, 8px radius
 *
 * Kanso: bilgi, eylem veya yön üretmeyen öğe yok. Kart yığını yok — yüzeyler
 * düz, ayrımlar hairline. Gölge yalnız gerçekten yükselen yüzeyde (sheet).
 */

/* ==========================================================================
   Pencere iskeleti
   ========================================================================== */

.shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  height: 100%;
  background: var(--surface-app);
}

/* Tam ekranda trafik ışıkları çekilir; üst bant küçülür. */
.shell[data-fullscreen="true"] { --titlebar-h: 12px; }

/* ---------------------------------------------------------------- Sidebar
   Pencerenin tepesine kadar çıkar; trafik ışıkları üst bandında durur. */

.sidebar {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 0 var(--space-3) var(--space-3);
  overflow: hidden;
  background: var(--surface-sidebar);
  border-right: 1px solid var(--border-subtle);
}

.sidebar-head {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  padding: var(--titlebar-h) var(--space-1) var(--space-4);
}

.sidebar-mark { flex: none; }

.sidebar-brand {
  overflow: hidden;
  font-size: var(--text-body);
  font-weight: 600;
  letter-spacing: -0.005em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.sidebar-item {
  position: relative;
  display: flex;
  gap: var(--space-2);
  align-items: center;
  width: 100%;
  min-height: var(--row-h);
  padding: 0 var(--space-2);
  color: var(--text-primary);
  font: inherit;
  text-align: left;
  white-space: nowrap;
  background: none;
  border: 0;
  border-radius: var(--radius);
  transition: background var(--motion-fast) var(--ease);
}

.sidebar-item:hover:not(:disabled) { background: var(--surface-hover); }

/* Seçili: tonal yüzey + solda 2px vurgu işareti. Vurgu alanı boyamaz. */
.sidebar-item[aria-current="page"] {
  font-weight: 500;
  background: var(--surface-selected);
}
.sidebar-item[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: 7px;
  bottom: 7px;
  left: 0;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
}
.sidebar-item[aria-current="page"] .sidebar-icon { opacity: 1; }
.sidebar-item:disabled { color: var(--text-muted); }
.sidebar-item:disabled .sidebar-icon { opacity: 0.35; }

.sidebar-icon {
  flex: none;
  width: 16px;
  height: 16px;
  opacity: 0.8;
}

.sidebar-spacer { flex: 1; }

.sidebar-footer {
  padding-top: var(--space-2);
  border-top: 1px solid var(--border-subtle);
}

/* ---------------------------------------------------------------- İçerik
   Yardımcı bar üstte tek satır; altında workspace ve (varsa) sağ panel. */

.content {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: var(--titlebar-h) minmax(var(--toolbar-h), auto) minmax(0, 1fr);
  min-width: 0;
  overflow: hidden;
  background: var(--surface-workspace);
}

/* Trafik ışıklarının satırı. İçerik sütununda da ayrılır ki yardımcı bar
   kimlik bloğuyla aynı yükseklikten başlasın. Sürükleme alanı. */
.titlebar-band {
  grid-row: 1;
  grid-column: 1 / -1;
  background: var(--surface-app);
}
.shell[data-fullscreen="true"] .titlebar-band { display: none; }

.toolbar {
  grid-row: 2;
  grid-column: 1 / -1;
  display: flex;
  gap: var(--space-2);
  align-items: center;
  min-width: 0;
  padding: 0 var(--space-4) 0 var(--space-5);
  background: var(--surface-app);
  border-bottom: 1px solid var(--border-subtle);
}

/* İçeriği olmayan bar bant değildir: çizgisi ve kendi rengi kalkar, workspace'in
   üst boşluğuna dönüşür. Yükseklik korunur — trafik ışıkları oraya oturuyor. */
.toolbar[data-empty="true"] {
  background: var(--surface-workspace);
  border-bottom-color: transparent;
}
.shell:has(.toolbar[data-empty="true"]) .titlebar-band { background: var(--surface-workspace); }

/* Sol uç: belge bağlamı. Belge yokken boş ve sakin. */
.toolbar-context {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  min-width: 0;
}

.doc-chip {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  min-width: 0;
  color: var(--text-primary);
  font-weight: 500;
}
.doc-chip .sidebar-icon { opacity: 0.7; }
.doc-chip-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.doc-chip-sep { color: var(--text-muted); }

.toolbar-spacer { flex: 1; min-width: var(--space-4); }

.toolbar-shell,
.toolbar-actions {
  display: flex;
  flex: none;
  gap: var(--space-2);
  align-items: center;
}
.toolbar-actions:empty { display: none; }

.content-body {
  grid-row: 3;
  grid-column: 1;
  min-width: 0;
  min-height: 0;
  overflow: auto;
}

.content-body:focus { outline: none; }

/* ------------------------------------------------------------- Inspector
   İçeriden yerleşik panel: yüzeye gömülü değil, üstten/sağdan/alttan
   --inspector-inset kadar içeride. Yalnız gösterilecek içerik varken var. */

.inspector-slot {
  grid-row: 3;
  grid-column: 2;
  width: calc(var(--inspector-w) + var(--inspector-inset));
  min-height: 0;
  padding: var(--inspector-inset) var(--inspector-inset) var(--inspector-inset) 0;
}

.inspector {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  background: var(--surface-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}

.inspector-head {
  flex: none;
  padding: var(--space-3) var(--space-4) var(--space-2);
}

.inspector-title,
.inspector-label {
  margin: 0;
  color: var(--text-secondary);
  font-size: var(--text-label);
  font-weight: 600;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}

.inspector-body {
  flex: 1;
  min-height: 0;
  padding: 0 var(--space-4) var(--space-4);
  overflow: auto;
}
.inspector-body > * + * { margin-top: var(--space-3); }

.inspector-section + .inspector-section {
  padding-top: var(--space-4);
  margin-top: var(--space-4);
  border-top: 1px solid var(--border-subtle);
}
.inspector-section > .inspector-label { margin-bottom: var(--space-2); }

/* Panelde anahtar–değer satırı: "Kesin hata   4". */
.kv {
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
  justify-content: space-between;
  min-height: 24px;
}
.kv-key { color: var(--text-secondary); }
.kv-value { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------- Workspace
   İçeriğin nefes aldığı yüzey. Başlık içeriğin parçası, üstten nefesli. */

.surface {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  max-width: 1040px;
  padding: var(--space-6) var(--space-7) var(--space-6);
}

/* ==========================================================================
   İlkeller
   ========================================================================== */

/* ---------------------------------------------------------------- Button
   Kompakt: 28px. Birincil vurgu dolgulu, ikincil tonal + hairline. */

.btn {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  min-height: var(--control-h);
  padding: 0 var(--space-3);
  color: var(--text-primary);
  font: inherit;
  font-weight: 500;
  white-space: nowrap;
  background: var(--surface-hover);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  transition:
    background var(--motion-fast) var(--ease),
    border-color var(--motion-fast) var(--ease);
}

.btn:hover:not(:disabled) { background: var(--surface-selected); border-color: var(--border-strong); }
.btn:active:not(:disabled) { background: var(--surface-selected); }
.btn:disabled { color: var(--text-muted); border-color: var(--border-subtle); }

.btn-primary {
  color: var(--on-accent);
  background: var(--accent);
  border-color: transparent;
}
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
/* Etkisiz bir eylem öne çıkmaz: dolgulu gri, koyu temada çevresindeki her
   şeyden açıktı ve devre dışı düğme ekranın en ağır öğesi oluyordu (gerçek
   pencerede görüldü — Denetle, seçim yokken "Kopyaya uygula…"). */
.btn-primary:disabled {
  color: var(--text-muted);
  background: var(--surface-hover);
  border-color: var(--border-subtle);
}

.btn-quiet {
  color: var(--text-secondary);
  font-weight: 400;
  background: none;
  border-color: transparent;
}
.btn-quiet:hover:not(:disabled) {
  color: var(--text-primary);
  background: var(--surface-hover);
}

.btn-sm { min-height: 24px; padding: 0 var(--space-2); font-size: var(--text-meta); }

/* ------------------------------------------------------------ IconButton */

.icon-btn {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: var(--control-h);
  height: var(--control-h);
  color: var(--text-secondary);
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius);
  transition: background var(--motion-fast) var(--ease);
}

.icon-btn:hover:not(:disabled) { color: var(--text-primary); background: var(--surface-hover); }
.icon-btn:active:not(:disabled) { background: var(--surface-selected); }
.icon-btn:disabled { color: var(--text-muted); }
.icon-btn[aria-pressed="true"] {
  color: var(--text-primary);
  background: var(--surface-selected);
}
.icon-btn svg { width: 16px; height: 16px; }

/* ------------------------------------------------------------------ Pill
   Tür rozeti. Tek renk, hairline; anlam metinle. */

.pill {
  display: inline-flex;
  flex: none;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  color: var(--text-secondary);
  font-size: var(--text-label);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
}

/* -------------------------------------------------------- Section header
   Küçük BÜYÜK HARF etiket; üstünde hairline. */

.section-head {
  margin: 0 0 var(--space-2);
  color: var(--text-secondary);
  font-size: var(--text-label);
  font-weight: 600;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}

/* ------------------------------------------------------------ EmptyState
   Boş, hata ve "sonuç yok" durumlarının TEK yüzeyi: Home, Düzenle'nin iki
   durumu ve Denetle'nin temiz belgesi aynı ritimde durur. Optik üst-orta:
   kalan alanın %38'i üstte kalır. Kart, çerçeve, ikon ve çizim yok. */

.empty {
  display: grid;
  flex: 1;
  grid-template-rows: 38fr auto 62fr;
  justify-items: center;
  min-height: 200px;
  padding: var(--space-4);
  text-align: center;
}
.empty-body {
  display: flex;
  grid-row: 2;
  flex-direction: column;
  align-items: center;
}
.empty-title { margin: 0; font-size: var(--text-heading); font-weight: 600; }
.empty-note {
  max-width: 46ch;
  margin: var(--space-2) 0 0;
  color: var(--text-secondary);
}
/* İşin gerçekten yapıldığını gösteren künye. Tek satır, sessiz. */
.empty-meta {
  margin: var(--space-5) 0 0;
  color: var(--text-secondary);
  font-size: var(--text-meta);
}
.empty-action { margin-top: var(--space-5); }

/* Home: son kullanılanlar yüzeyin ASIL içeriğidir ve yukarıdan başlar.
   Boş durum yalnız hiç kayıt yokken çizilir ve kalan alanı alır. */
.home { display: flex; flex-direction: column; }
.recents { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.recents .file-list { min-height: 0; overflow: auto; }

/* Yüzeyin alt kenarı: sürükle-bırak ipucu ve listeyi temizleme. Liste kısa
   kalsa da yüzey üstten ve alttan çerçevelenir; ortadaki boşluk listenin
   büyüme alanıdır, ölü alan değil. */
.home-foot {
  display: flex;
  flex: none;
  gap: var(--space-4);
  align-items: center;
  justify-content: space-between;
  padding-top: var(--space-3);
  margin-top: var(--space-4);
  border-top: 1px solid var(--border-subtle);
}
.home-foot > p { margin: 0; color: var(--text-secondary); font-size: var(--text-meta); }

/* Sürükle-bırak hedefi tüm yüzey. Kesikli çerçeve yalnız sürükleme sırasında. */
.home {
  border: 1px dashed transparent;
  border-radius: var(--radius-lg);
  transition:
    background var(--motion) var(--ease),
    border-color var(--motion) var(--ease);
}
.home[data-over="true"] {
  background: var(--accent-quiet);
  border-color: var(--accent);
}

/* --------------------------------------------------------------- FileRow
   Liste: hairline ayırıcı, sağda tür rozeti ve soluk zaman. Kart değil. */

.file-list { padding: 0; margin: 0; list-style: none; }
.file-list li + li { border-top: 1px solid var(--border-subtle); }

.file-row {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  width: 100%;
  min-height: 40px;
  padding: 0 var(--space-2);
  color: inherit;
  font: inherit;
  text-align: left;
  background: none;
  border: 0;
  border-radius: var(--radius-sm);
  transition: background var(--motion-fast) var(--ease);
}

button.file-row:hover { background: var(--surface-hover); }

/* Ad ve tür birlikte okunur; zaman satırın sağ ucunda kalır. Ad tek başına
   sola, rozet ve zaman birlikte sağa itildiğinde göz bin piksel yol alıyordu. */
.file-name {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-row .pill { margin-right: auto; }

.file-kind {
  flex: none;
  color: var(--text-secondary);
  font-size: var(--text-meta);
}

.file-time {
  flex: none;
  min-width: 9ch;
  color: var(--text-secondary);
  font-size: var(--text-meta);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* ---------------------------------------------------------------- Status
   Küçük, anlaşılır bildirim. Büyük yeşil kutu yok. */

.status {
  display: flex;
  gap: var(--space-2);
  align-items: baseline;
  padding: var(--space-2) var(--space-3);
  margin: 0 0 var(--space-4);
  color: var(--text-secondary);
  background: var(--surface-sunken);
  border-radius: var(--radius);
}

.status[data-tone="error"] {
  color: var(--danger);
  background: var(--danger-quiet);
}
.status[data-tone="success"] {
  color: var(--success);
  background: var(--success-quiet);
}
.status-mark { flex: none; font-weight: 600; }
.status-text { min-width: 0; }

/* İş sürüyor: satır içi, tam ekran değil. */
.spinner {
  display: inline-block;
  flex: none;
  width: 12px;
  height: 12px;
  border: 1.5px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 720ms linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ----------------------------------------------------------- Dialog/Sheet
   macOS sheet: üstten iner, pencereye bağlıdır. */

.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  background: rgb(0 0 0 / 22%);
  animation: sheet-veil var(--motion) var(--ease);
}

.sheet {
  width: min(520px, calc(100vw - var(--space-6)));
  max-height: calc(100vh - var(--space-7));
  overflow: auto;
  background: var(--surface-raised);
  border: 1px solid var(--border-subtle);
  border-top: 0;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  box-shadow: 0 8px 28px rgb(0 0 0 / 14%);
  animation: sheet-in var(--motion) var(--ease);
}

@keyframes sheet-veil { from { opacity: 0; } }
@keyframes sheet-in { from { transform: translateY(-10px); opacity: 0; } }

.sheet-head {
  padding: var(--space-5) var(--space-5) var(--space-3);
}
.sheet-head h2,
.sheet > h2 {
  margin: 0;
  font-size: var(--text-heading);
  font-weight: 600;
}
.sheet > h2 { padding: var(--space-5) var(--space-5) var(--space-3); }
.sheet > .selectable, .sheet > p { padding: 0 var(--space-5); }
.sheet-body { padding: 0 var(--space-5) var(--space-4); }
.sheet-actions {
  display: flex;
  gap: var(--space-2);
  justify-content: flex-end;
  padding: var(--space-3) var(--space-5) var(--space-5);
}

/* --------------------------------------------------------- Form control */

.field {
  display: flex;
  gap: var(--space-4);
  align-items: center;
  justify-content: space-between;
  min-height: 36px;
  padding: var(--space-1) 0;
}

.field + .field { border-top: 1px solid var(--border-subtle); }
.field-label { min-width: 0; }
.field-label > span {
  display: block;
  color: var(--text-secondary);
  font-size: var(--text-meta);
}

select,
input[type="text"],
input[type="number"] {
  min-height: 26px;
  padding: 2px var(--space-2);
  color: var(--text-primary);
  font: inherit;
  background: var(--surface-raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
}

/* ==========================================================================
   Bulgu listesi
   --------------------------------------------------------------------------
   Denetle'de kullanılır. Ciddiyet ASLA yalnız renkle verilmez: her satırda
   ayrı bir şekil işareti (.finding-mark) ve ayrı bir metin etiketi
   (.finding-sev) bulunur; renk yalnız yardımcıdır. İşaretlenen metin aralığı
   da arka planla yetinmez, alt çizgi taşır — yüksek kontrast ve renk körlüğü
   durumunda arka plan farkı kaybolabilir.

   Bu sözleşme `qa/tests/denetle-a11y.test.mjs` tarafından kilitlenmiştir.
   ========================================================================== */

.findings { padding: 0; margin: 0; list-style: none; }
.finding { border-bottom: 1px solid var(--border-subtle); }

.finding-head {
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
  width: 100%;
  min-height: 36px;
  padding: var(--space-2) var(--space-2);
  color: inherit;
  font: inherit;
  text-align: left;
  background: none;
  border: 0;
  border-radius: var(--radius-sm);
  transition: background var(--motion-fast) var(--ease);
}

.finding-head:hover { background: var(--surface-hover); }
.finding[data-active="true"] .finding-head { background: var(--surface-selected); }

/* Şekil işareti — rengin taşımadığı ayrımı taşır. */
.finding-mark {
  flex: none;
  width: 1.1em;
  font-weight: 700;
  text-align: center;
}

/* Metin etiketi — "Kesin hata", "Uyarı", "İncele". */
.finding-sev {
  flex: none;
  /* En uzun etiket "KESİN HATA" (10 karakter). Dar bırakılırsa o satırın
     başlığı diğerlerinden sağa kayar ve liste hizasını kaybeder. */
  min-width: 11ch;
  font-size: var(--text-label);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.finding-title { flex: 1; min-width: 0; }

.finding-loc {
  flex: none;
  color: var(--text-secondary);
  font-size: var(--text-meta);
  font-variant-numeric: tabular-nums;
}

.finding[data-severity="error"] .finding-mark,
.finding[data-severity="error"] .finding-sev { color: var(--danger); }
.finding[data-severity="warning"] .finding-mark,
.finding[data-severity="warning"] .finding-sev { color: var(--warning); }
.finding[data-severity="review"] .finding-mark,
.finding[data-severity="review"] .finding-sev { color: var(--review); }

.finding-body {
  padding: 0 var(--space-2) var(--space-4) calc(1.1em + 11ch + var(--space-3) * 2);
}
.finding-body > * + * { margin-top: var(--space-2); }
.finding-message { margin: 0; max-width: var(--measure); }
.finding-why { margin: 0; max-width: var(--measure); color: var(--text-secondary); }

.finding-excerpt {
  max-width: var(--measure);
  padding: var(--space-2) var(--space-3);
  margin: 0;
  color: var(--text-secondary);
  background: var(--surface-sunken);
  border-radius: var(--radius-sm);
}

/* Arka plan tek başına yetmez: alt çizgi renkten bağımsız olarak kalır. */
.finding-excerpt mark {
  color: var(--text-primary);
  background: var(--warning-quiet);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.finding-fix {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
  max-width: var(--measure);
}
.finding-fix code {
  padding: 1px 4px;
  font-family: var(--font-mono);
  font-size: 0.92em;
  background: var(--surface-sunken);
  border-radius: var(--radius-sm);
}
.finding-fixnote { color: var(--text-muted); }
.finding-nofix { margin: 0; color: var(--text-muted); }

/* ==========================================================================
   Kip yüzeylerinde ortaklaşan küçük parçalar
   ========================================================================== */

.row { display: flex; flex-wrap: wrap; gap: var(--space-2); }

/* Dönüşüm akışı: KAYNAK → HEDEF. Form değil; iki durak ve aralarında yön.
   İçerik az olduğu için yüzeyin tepesine yapışıp altında ölü alan bırakmaz;
   boş durumlarla aynı optik konumda, kalan alanın %38'i üstte durur. */
.surface.convert { display: grid; grid-template-rows: 38fr auto 62fr; justify-items: center; }
.convert-body { grid-row: 2; width: 100%; max-width: 560px; }

.flow-step + .flow-step { margin-top: 0; }
.flow-arrow {
  padding: var(--space-2) 0;
  color: var(--text-muted);
  font-size: var(--text-heading);
  text-align: center;
}
.flow-target { margin: 0; font-size: var(--text-title); font-weight: 600; letter-spacing: -0.012em; }

/* Çıktı klasörü: bir satır. Tam yol ipucunda kalır. */
.flow-dest {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  padding-top: var(--space-3);
  margin: var(--space-5) 0 0;
  color: var(--text-secondary);
  font-size: var(--text-meta);
  border-top: 1px solid var(--border-subtle);
}
.flow-dest > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Tamamlandı: ne üretildi, nerede. Akışın yerini alır, üstüne binmez. */
.convert-done > h1 { margin: 0 0 var(--space-4); font-size: var(--text-heading); font-weight: 600; }
.convert-action { margin-top: var(--space-5); }
.file-kind[data-tone="error"] { color: var(--danger); }

/* Bir işin sonucu. Büyük yeşil kutu değil; ince çizgili sade bir satır. */
.result {
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--border-subtle);
}
.result-line { color: var(--text-primary); }
.result[data-tone="error"] .result-line { color: var(--danger); }

.warn-list {
  max-width: var(--measure);
  padding-left: var(--space-4);
  margin: var(--space-1) 0 0;
  color: var(--text-secondary);
  font-size: var(--text-meta);
}
.warn-list strong { font-weight: 600; }

/* Ayarlar bölümleri */
.settings-group + .settings-group { margin-top: var(--space-5); }
.settings-group > h3 {
  margin: 0 0 var(--space-1);
  color: var(--text-secondary);
  font-size: var(--text-label);
  font-weight: 600;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}
.settings-about {
  color: var(--text-secondary);
