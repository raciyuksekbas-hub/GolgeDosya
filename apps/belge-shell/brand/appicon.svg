<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="GölgeDosya">
  <!--
    Uygulama ikonu. macOS karosu: Big Sur yuvarlatma oranı (%22.37), düz sumi
    zemin — gradyan, gölge, parlaklık yok. Sayfa karonun %55'ini kaplar;
    kaldırılmış köşe aynı 64'lük ızgara oranlarını korur (genişliğin %60'ı,
    yüksekliğin %50'si).
  -->
  <defs>
    <clipPath id="gd-tile"><rect x="0" y="0" width="1024" height="1024" rx="229"/></clipPath>
    <clipPath id="gd-icon-page"><rect x="232" y="176" width="560" height="672" rx="98"/></clipPath>
  </defs>
  <g clip-path="url(#gd-tile)">
    <rect width="1024" height="1024" fill="#1C1C1E"/>
    <g clip-path="url(#gd-icon-page)">
      <rect x="232" y="176" width="560" height="672" fill="#8A6A3E"/>
      <path d="M232 176 H792 V512 L456 848 H232 Z" fill="#F5F4F1"/>
    </g>
  </g>
</svg>
