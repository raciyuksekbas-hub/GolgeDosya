<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GölgeDosya">
  <!--
    GölgeDosya — "Kat" işareti.

    Tek siluet: bir sayfa. Sağ alt köşesi kaldırılmış ve altındaki katman
    görünüyor. Sayfa kullanıcının belgesi; kaldırılan köşenin altındaki
    pirinç yüzey, belgeye eşlik eden ikinci katman — ürünün kendisi.
    İki şekil, tek diyagonal: 16 px'te de okunur.
  -->
  <defs>
    <clipPath id="gd-page"><rect x="12" y="8" width="40" height="48" rx="7"/></clipPath>
  </defs>
  <g clip-path="url(#gd-page)">
    <rect x="12" y="8" width="40" height="48" fill="#8A6A3E"/>
    <path d="M12 8 H52 V32 L28 56 H12 Z" fill="#1C1C1E"/>
  </g>
</svg>
