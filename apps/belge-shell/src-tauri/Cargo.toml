[package]
name = "belge-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Yüksekbaş Belge — birleşik belge çalışma ortamı (geçici teknik ad)"

[lib]
name = "belge_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Feature-level rollback (bkz. talep §17).
#
# Her modül kendi cargo feature'ı arkasında yaşar. Bir modül regresyon çıkarırsa
# tüm uygulamayı geri almak yerine yalnız o feature kapatılır; motoru binary'ye
# hiç linklenmez ve route arayüzde görünmez.
#
# HİÇBİRİ default DEĞİL: Phase 2'de hiçbir feature henüz taşınmadı.
#   Phase 3 -> feature_tavzih
#   Phase 4 -> feature_ikincigoz
#   Phase 5 -> feature_degisikis
#   Phase 6 -> feature_duzenek
feature_tavzih = []
feature_ikincigoz = []
feature_degisikis = []
feature_duzenek = []
