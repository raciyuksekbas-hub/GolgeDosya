[package]
name = "belge-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "GölgeDosya — birleşik belge çalışma ortamı"

[lib]
name = "belge_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
# Geçici dosyalar düşerken kendiliğinden silinsin: migration kodunda açık bir
# dosya silme çağrısı bulunmasın (bkz. release-gate "migration değişmezleri").
process-bridge.workspace = true
tempfile.workspace = true

# Modül motorları. Yalnız kendi feature'ı açıkken linklenir; kapalıyken binary'ye
# hiç girmez. `document-core` birleşik workspace içindeki tek belge çekirdeğidir.
tavzih-core = { workspace = true, optional = true }
# Kasten optional DEĞİL. Capability dosyaları derleme sırasında ayrıştırılır ve
# `opener:*` izinlerinin tanımlı olması bu crate'in bağımlılık grafiğinde
# bulunmasına bağlıdır. Optional yapıldığında `--no-default-features` ile
# yapılan tam geri alma derlemesi "Permission opener:allow-reveal-item-in-dir
# not found" ile kırılıyordu. Plugin'in kaydı ve komutları feature'a bağlı
# kalmaya devam ediyor; kapalıyken hiçbir IPC yüzeyi açılmaz.
tauri-plugin-opener = "2"
# Canonical source artık bu depoda (crates/ikincigoz-core). Bağımsız İkinciGöz
# deposu dondurulmuş baseline olarak duruyor ama build ona bağlı DEĞİL:
# hem referans implementasyon hem de parser/writeback karşılaştırma kaynağı odur.
# Parser consolidation ayrı bir fazdır (bkz. docs/MIGRATION.md).
ikincigoz-core = { workspace = true, optional = true }
# DüzenEk'in çekirdeği de KOPYALANMADI; kaynak standalone deposunda kalıyor ve
# dondurulmuş baseline (duzenek-premerge-2026-09-07) parity kaynağıdır.
# GEÇİCİ kardeş-dizin yolu; DüzenEk emekliye ayrılınca kalkar.
ekler-core = { workspace = true, optional = true }
lopdf = { version = "0.34", optional = true }

[features]
default = ["custom-protocol", "feature_tavzih", "feature_ikincigoz", "feature_degisikis", "feature_duzenek"]
custom-protocol = ["tauri/custom-protocol"]

# Feature-level rollback (bkz. talep §17).
#
# Her modül kendi cargo feature'ı arkasında yaşar. Bir modül regresyon çıkarırsa
# tüm uygulamayı geri almak yerine yalnız o feature kapatılır; motoru binary'ye
# hiç linklenmez ve route arayüzde görünmez.
#
# Bir modül default'a eklendiğinde capability dosyası da
# `capabilities-planned/` içinden `capabilities/` içine taşınmalıdır; izin, kodla
# birlikte gelir ve kodla birlikte gider. scripts/check-architecture.sh bu ikisinin
# tutarlılığını denetler.
#
#   Phase 3 -> feature_tavzih      TAŞINDI
#   Phase 4 -> feature_ikincigoz  TAŞINDI
#   Phase 5 -> feature_degisikis  TAŞINDI
#   Phase 6 -> feature_duzenek   TAŞINDI
feature_tavzih = ["dep:tavzih-core"]
feature_ikincigoz = ["dep:ikincigoz-core"]
feature_degisikis = []  # motoru TypeScript'te; Rust bağımlılığı yok
feature_duzenek = ["dep:ekler-core", "dep:lopdf"]

[dev-dependencies]
# Parity testleri çıktıyı yeniden açıp ölçer.
lopdf.workspace = true
sha2.workspace = true
tempfile.workspace = true
