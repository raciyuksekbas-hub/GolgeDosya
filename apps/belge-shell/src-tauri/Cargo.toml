[package]
name = "belge-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Yüksekbaş Belge — birleşik belge çalışma ortamı (geçici teknik ad)"

[lib]
name = "belge_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true

# Modül motorları. Yalnız kendi feature'ı açıkken linklenir; kapalıyken binary'ye
# hiç girmez. `document-core` birleşik workspace içindeki tek belge çekirdeğidir.
tavzih-core = { path = "../../../crates/document-core", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[features]
default = ["custom-protocol", "feature_tavzih"]
custom-protocol = ["tauri/custom-protocol"]

# Feature-level rollback (bkz. talep §17).
#
# Her modül kendi cargo feature'ı arkasında yaşar. Bir modül regresyon çıkarırsa
# tüm uygulamayı geri almak yerine yalnız o feature kapatılır; motoru binary'ye
# hiç linklenmez ve route arayüzde görünmez.
#
# Bir modül default'a eklendiğinde capability dosyası da
# `capabilities-planned/` içinden `capabilities/` içine taşınmalıdır; izin, kodla
# birlikte gelir ve kodla birlikte gider. scripts/check-architecture.sh bu ikisinin
# tutarlılığını denetler.
#
#   Phase 3 -> feature_tavzih      TAŞINDI
#   Phase 4 -> feature_ikincigoz
#   Phase 5 -> feature_degisikis
#   Phase 6 -> feature_duzenek
feature_tavzih = ["dep:tavzih-core", "dep:tauri-plugin-opener"]
feature_ikincigoz = []
feature_degisikis = []
feature_duzenek = []
