# Ortak belge çekirdeği. Kaynak: Tavzih `crates/tavzih-core`, commit 7df3f5dd.
#
# Paket adı bilerek `tavzih-core` olarak KORUNDU. Amaç tekilleştirmenin mekanik
# ve geri alınabilir kalması: hiçbir tüketicide tek bir `use tavzih_core::`
# satırı değişmek zorunda değil. Dizin adı hedef mimariyi (`document-core`)
# yansıtır; paket adının değiştirilmesi ayrı ve bilinçli bir adımdır.
#
# Bağımlılıklar workspace'ten DEĞİL, açık sürümlerle alınır. Bunlar Tavzih'in
# Cargo.lock'unda bugün çözülen sürümlerin aynısıdır; feature kümesini bile
# genişletmiyoruz, çünkü bu fazın sözleşmesi "davranış değişmeyecek".
[package]
name = "tavzih-core"
version = "1.0.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Tavzih conversion engine: DOCX <-> UDF via a format-neutral canonical document model."

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
