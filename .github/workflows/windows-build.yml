# GölgeDosya — Windows x64 paketi (NSIS installer + portable)
#
# NEDEN CI: NSIS'in macOS/ARM portu (Homebrew makensis 3.12) dört satırlık
# boş bir betikte bile "Generating language tables" adımında std::bad_alloc
# ile çöküyor. Ürün ya da Tauri kaynaklı değil. GitHub'ın `windows-latest`
# runner'ı bu iş için GERÇEK bir Windows ortamıdır: derleme, installer üretimi,
# kurulum ve süreç düzeyinde açılış orada kanıtlanır.
#
# Yalnız elle tetiklenir. Tag, Release ve yayımlama YOK: çıktı sadece bir
# Actions artifact'ıdır.
name: Windows paketi

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Beklenen FINAL_HEAD (40 haneli tam SHA). Boş bırakılırsa doğrulama atlanır."
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      # § Kaynak bütünlüğü: başka bir commit'ten build kabul edilmez.
      - name: Kaynak bütünlüğü
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "commit    : $sha"                        | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "ref       : $env:GITHUB_REF"             | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($env:EXPECTED_SHA) {
            if ($env:EXPECTED_SHA.Trim() -ne $sha) {
              throw "FINAL_HEAD uyuşmuyor. Beklenen $($env:EXPECTED_SHA.Trim()), derlenen $sha"
            }
            "FINAL_HEAD dogrulandi." | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } else {
            "UYARI: expected_sha verilmedi, FINAL_HEAD dogrulanmadi." | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          "SHA=$sha" >> $env:GITHUB_ENV

      - name: Rust zinciri (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/belge-shell/package-lock.json

      - name: Ortam raporu
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $rows = @(
            "| araç | sürüm |", "|---|---|",
            "| rustc | $((rustc -V))|",
            "| cargo | $((cargo -V))|",
            "| node | $((node -v))|",
            "| npm | $((npm -v))|",
            "| Windows | $([Environment]::OSVersion.Version.ToString()) ($((Get-CimInstance Win32_OperatingSystem).Caption))|",
            "| runner image | $env:ImageOS / $env:ImageVersion|"
          )
          $rows | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Bağımlılıklar (npm ci)
        working-directory: apps/belge-shell
        run: npm ci

      # ---------- § Windows üzerinde ön kapılar ----------
      # Her biri devam eder; sonuç en sonda toplu değerlendirilir. Amaç tek
      # koşuda azami bilgi: ilk düşen kapı installer'ı da görmemizi engellemesin.

      - name: 'Kapı 1 — arayüz tip denetimi'
        id: gate_tsc
        continue-on-error: true
        working-directory: apps/belge-shell
        run: npm run typecheck

      # Rust tarafindan ONCE gelmeli: `tauri::generate_context!()` derleme
      # aninda frontendDist'i (../dist) diskte arar ve yoksa proc macro panikler.
      # Ilk kosuda bu adim Kapi 1'den SONRA durdugu icin surum tutarliligi kapisi
      # testin kendisiyle ilgisiz bir derleme hatasiyla dusmustu.
      - name: Arayüzü derle (Rust build.rs frontendDist bekliyor)
        working-directory: apps/belge-shell
        run: npm run build

      - name: 'Kapı 2 — sürüm tutarlılığı'
        id: gate_version
        continue-on-error: true
        run: cargo test -p belge-shell --test version_consistency --locked -- --nocapture

      # `npm test` Windows'ta cmd.exe uzerinden kosar ve `qa/tests/*.test.mjs`
      # globu GENISLETILMEZ. Ayrica vitest'i surum kapisinin kanitlanmis
      # bicimiyle cagiriyoruz (tek fork): varsayilan havuz Windows'ta kirilgan.
      - name: 'Kapı 3 — arayüz testleri (UX + a11y + motor)'
        id: gate_front
        continue-on-error: true
        shell: bash
        working-directory: apps/belge-shell
        run: |
          node --test qa/tests/*.test.mjs
          npx vitest run --pool=forks --poolOptions.forks.singleFork=true

      # § Windows'a özgü başarısızlık burada görünür: macOS'un geçmiş olması
      # Windows'u kanıtlamaz. Bu adım aynı zamanda §16'nın motor smoke'udur —
      # pdf-core, document-core, ekler-core, ikincigoz-core, process-bridge ve
      # kabuk komutları native Windows'ta koşar.
      - name: 'Kapı 4 — cargo test --workspace --locked (native Windows)'
        id: gate_rust
        continue-on-error: true
        run: cargo test --workspace --locked --no-fail-fast

      # § PDF önizleme: GERÇEK render (Windows.Data.Pdf). Analitik altın görüntü,
      # sayfa kimliği, /Rotate + kullanıcı dönüşü, CropBox, DPI, taranmış /
      # Flate / PNG-öngörücülü görüntüler, GölgeDosya'nın kendi çıktıları, bozuk
      # ve parolalı PDF. Eskiden bu kapı Windows'taki REDDİ doğruluyordu; artık
      # macOS'la aynı raster sözleşme testlerini de koşturur.
      - name: 'Kapı 5 — PDF önizleme: gerçek render (Windows.Data.Pdf)'
        id: gate_raster
        continue-on-error: true
        run: |
          cargo test -p ekler-core --locked --test raster_platform_contract --test workspace_raster_tests --test pdf_fidelity_tests --test round2_tooling_tests
          cargo test -p belge-shell --locked --test duzenek_parity

      # ---------- § Üretim derlemesi ----------
      - name: Tauri üretim derlemesi (NSIS + portable)
        working-directory: apps/belge-shell
        run: |
          # Günlük dosyaya da yazılır: kurulumun dil tabloları aşağıda ölçülür.
          # NSIS araçları her koşuda GitHub sürüm varlıklarından indirilir; o
          # indirmenin geçici HTTP 5xx hatası yeniden denenir (derleme önbellekte,
          # ikinci deneme yalnız paketlemedir). Başka her hata ilk seferde düşer.
          for ($try = 1; $try -le 3; $try++) {
            npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis --verbose 2>&1 | Tee-Object -FilePath ../../tauri-build.log
            $code = $LASTEXITCODE
            if ($code -eq 0) { break }
            if (-not (Select-String -Path ../../tauri-build.log -Pattern 'failed to bundle project: `http status: 5\d\d`' -Quiet)) { break }
            Write-Host "Paketleme aracı indirilemedi (HTTP 5xx), yeniden deneniyor: $try/3"
            Start-Sleep -Seconds 30
          }
          if ($code -ne 0) { throw "tauri build $code ile bitti" }

      - name: Çıktıları topla
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $rel = "target/x86_64-pc-windows-msvc/release"
          $setup = Get-ChildItem "$rel/bundle/nsis/*-setup.exe" -ErrorAction Stop | Select-Object -First 1
          $portable = Get-ChildItem "$rel/belge-shell.exe" -ErrorAction Stop
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $setup.FullName  "out/$($setup.Name)"
          Copy-Item $portable.FullName "out/GolgeDosya_0.3.0_x64.exe"
          Copy-Item LICENSE out/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md out/THIRD_PARTY_NOTICES.md
          "SETUP_NAME=$($setup.Name)" >> $env:GITHUB_ENV
          "### Üretilen dosyalar"                                    | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem out | ForEach-Object { "- $($_.Name) — $($_.Length) bayt" } |
            Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      # § Sürüm metadata: eski sürüm/ürün adı kullanıcıya görünen alanlarda kalmamalı.
      - name: 'Sürüm metadata ve mimari'
        id: meta
        continue-on-error: true
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $ok = $true
          foreach ($f in @("out/GolgeDosya_0.3.0_x64.exe", "out/$env:SETUP_NAME")) {
            $v = (Get-Item $f).VersionInfo
            # PE COFF başlığından makine tipi: 0x8664 = x64
            $fs = [IO.File]::OpenRead((Resolve-Path $f)); $br = New-Object IO.BinaryReader($fs)
            $fs.Position = 0x3C; $pe = $br.ReadInt32(); $fs.Position = $pe + 4
            $machine = $br.ReadUInt16(); $br.Dispose(); $fs.Dispose()
            $arch = switch ($machine) { 0x8664 {"x64"} 0x14c {"x86"} 0xAA64 {"arm64"} default {"0x{0:X}" -f $machine} }
            "### $f"                                  | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            "- ProductName    : $($v.ProductName)"    | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            "- FileVersion    : $($v.FileVersion)"    | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            "- ProductVersion : $($v.ProductVersion)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            "- mimari         : $arch"                | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            # NSIS installer stub'i BILEREK 32-bit'tir (her Windows'ta calissin
            # diye); tasidigi yuk x64'tur. Mimari sarti yalniz uygulama ikilisine.
            if ($f -notmatch "setup" -and $arch -ne "x64") { "  ✗ uygulama ikilisi x64 degil"; $ok = $false }
            if ("$($v.FileVersion)$($v.ProductVersion)" -match "0\.2\.0") { "  ✗ eski surum 0.2.0 izi"; $ok = $false }
          }
          # Portable exe kullanıcıya görünen alanları taşımalı; installer'ın
          # kendi VersionInfo'su NSIS'ten gelir ve ürün sürümünü taşımayabilir.
          $pv = (Get-Item "out/GolgeDosya_0.3.0_x64.exe").VersionInfo
          if ($pv.ProductName -ne "GölgeDosya") { "✗ ProductName 'GölgeDosya' degil: $($pv.ProductName)"; $ok = $false }
          foreach ($field in @($pv.FileVersion, $pv.ProductVersion)) {
            if ($field -notmatch "^0\.3\.0") { "✗ surum 0.3.0 ile baslamiyor: $field"; $ok = $false }
          }
          # Kurulum dili (saha maddesi 4): Türkçe Windows'ta Türkçe, başka her
          # dilde İngilizce. makensis dil tablolarını sayar: yalnız İngilizce
          # derlenmişken "1 language table" diyordu.
          $tables = Select-String -Path tauri-build.log -Pattern 'Install:.*?(\d+) language table' | Select-Object -First 1
          $count = if ($tables) { [int]$tables.Matches[0].Groups[1].Value } else { 0 }
          "- kurulum dil tablosu : $count (beklenen 2: English + Turkish)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($count -ne 2) { "✗ kurulum dil tablosu 2 değil: $count"; $ok = $false }
          if (-not $ok) { throw "surum metadata dogrulamasi basarisiz" }

      # § WebView2 durumu.
      - name: WebView2 durumu
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = $false
          foreach ($k in @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid")) {
            $p = Get-ItemProperty $k -ErrorAction SilentlyContinue
            if ($p -and $p.pv) { "WebView2 Runtime: $($p.pv)  ($k)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY; $found = $true; break }
          }
          if (-not $found) { "WebView2 Runtime: KAYITTA BULUNAMADI" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }

      # § Portable exe native açılış smoke: süreç gerçekten oluşuyor mu, hemen
      # çöküyor mu, belirli süre canlı kalıyor mu?
      - name: 'Smoke 1 — portable native açılış'
        id: smoke_portable
        continue-on-error: true
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $p = Start-Process -FilePath (Resolve-Path "out/GolgeDosya_0.3.0_x64.exe") -PassThru
          "PID $($p.Id) baslatildi"
          Start-Sleep -Seconds 20
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "portable exe 20 saniye icinde oldu (sessiz cokme) — exit $($p.ExitCode)" }
          "20 saniye sonra hala canli. Bellek: $([math]::Round($alive.WorkingSet64/1MB,1)) MB"  |
            Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Stop-Process -Id $p.Id -Force
          "portable acilis smoke: GECTI" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      # § Installer smoke: sessiz kurulum → kurulu yolu bul → sürüm → aç →
      #   bildirim dosyaları → kaldır.
      - name: 'Smoke 2 — installer kur / çalıştır / kaldır'
        id: smoke_installer
        continue-on-error: true
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $roots = @("HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
                     "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall",
                     "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall")
          function Snapshot { $roots | ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } | ForEach-Object { $_.PSPath } }
          $before = Snapshot

          # Tauri NSIS sessiz kurulum bayrağı: /S (buyuk S) — Tauri dokumantasyonu.
          $setup = Resolve-Path "out/$env:SETUP_NAME"
          "kurulum: $setup /S"
          $proc = Start-Process -FilePath $setup -ArgumentList "/S" -PassThru -Wait
          "installer cikis kodu: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "installer sifirdan farkli cikis kodu dondurdu: $($proc.ExitCode)" }
          Start-Sleep -Seconds 5

          # @(...) ZORUNLU: tek bir yeni anahtar bulundugunda PowerShell diziyi
          # skalere indirger ve $new[0] dizinin ilk ogesini degil DIZENIN ilk
          # KARAKTERINI ('M') verir. Ilk kosuda kurulum basariliydi, bu adim
          # tam olarak bu yuzden dustu.
          $new = @(Snapshot | Where-Object { $before -notcontains $_ })
          if ($new.Count -eq 0) { throw "kurulumdan sonra yeni bir Uninstall kaydi olusmadi" }
          $key = Get-ItemProperty $new[0]
          "### Kurulu kayit" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "- DisplayName     : $($key.DisplayName)"     | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "- DisplayVersion  : $($key.DisplayVersion)"  | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "- Publisher       : $($key.Publisher)"       | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "- InstallLocation : $($key.InstallLocation)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($key.DisplayVersion -ne "0.3.0") { throw "kurulu surum 0.3.0 degil: $($key.DisplayVersion)" }

          # Kayit defterindeki InstallLocation degeri TIRNAKLI saklanir
          # ("C:\Users\...\GölgeDosya"). Tirnaklari birlikte gecirmek
          # Test-Path'i dusurur; kurulum basariliyken adim bu yuzden dustu.
          $dir = $key.InstallLocation.Trim('"').TrimEnd('\')
          if (-not (Test-Path -LiteralPath $dir)) { throw "InstallLocation diskte yok: $dir" }
          "- cozulen yol     : $dir" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "### Kurulu dizin" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -LiteralPath $dir -Recurse -File | ForEach-Object {
            "- $($_.FullName.Substring($dir.Length).TrimStart('\')) — $($_.Length) bayt"
          } | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

          # § Bildirim dosyaları GERÇEK kurulu yolda olmalı; depoda olması yetmez.
          $missing = @()
          foreach ($n in @("LICENSE", "THIRD_PARTY_NOTICES.md")) {
            $hit = Get-ChildItem -LiteralPath $dir -Recurse -File -Filter $n -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { "bildirim bulundu: $($hit.FullName) ($($hit.Length) bayt)" }
            else { $missing += $n }
          }
          if ($missing) { throw "kurulu uygulamada bildirim dosyasi eksik: $($missing -join ', ')" }

          # Kurulu exe native acilis smoke
          $exe = Get-ChildItem -LiteralPath $dir -Filter "*.exe" -File | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          $iv = (Get-Item $exe.FullName).VersionInfo
          "kurulu exe: $($exe.Name)  ProductName=$($iv.ProductName)  FileVersion=$($iv.FileVersion)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "kurulu exe 20 saniye icinde oldu (sessiz cokme) — exit $($p.ExitCode)" }
          "kurulu uygulama 20 saniye canli kaldi" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 3

          # Kaldırma: Tauri NSIS kaldiricisi da /S destekler.
          $unins = if ($key.QuietUninstallString) { $key.QuietUninstallString } else { "$($key.UninstallString) /S" }
          "kaldirma: $unins"
          $exePath = ($unins -split '"')[1]
          if (-not $exePath) { $exePath = ($unins -split ' ')[0] }
          $u = Start-Process -FilePath $exePath -ArgumentList "/S" -PassThru -Wait
          Start-Sleep -Seconds 8
          "kaldirici cikis kodu: $($u.ExitCode)"
          if (Test-Path -LiteralPath $dir) {
            $left = Get-ChildItem -LiteralPath $dir -Recurse -File -ErrorAction SilentlyContinue
            if ($left) { "UYARI: kaldirmadan sonra kalan dosya: $($left.Count)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }
            else { "kaldirma temiz (dizin bos)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }
          } else { "kaldirma temiz (dizin silindi)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }

      # § Kapı 6 — GERÇEK pencere. Smoke'lar yalnız sürecin canlı kaldığını
      # ölçer; burada paketlenmiş uygulama WebView2 uzaktan hata ayıklama ucuyla
      # açılır, sayfa CDP ile okunur ve Windows'a GERÇEK klavye/fare girdisi
      # verilir. Saha maddeleri: tarayıcı menüsü ve F5/Ctrl+R (32, 38, 26, 39),
      # Klasörde Göster (13), PDF önizleme akışları (2–3), ekran görüntüleri
      # (açık/koyu × üç boyut). Her iddianın kendi kontrolü vardır; kontrol
      # düşerse iddia geçmiş sayılmaz. Ayrıntı: apps/belge-shell/qa/windows/.
      - name: 'Kapı 6 — gerçek pencere (WebView2 + gerçek girdi)'
        id: gate_field
        continue-on-error: true
        working-directory: apps/belge-shell
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $exe = (Resolve-Path ../../out/GolgeDosya_0.3.0_x64.exe).Path
          node qa/windows/saha-e2e.mjs --exe $exe --out ../../saha-kanit
          $code = $LASTEXITCODE
          if (Test-Path ../../saha-kanit/sonuc.md) {
            Get-Content ../../saha-kanit/sonuc.md -Encoding UTF8 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          # Harness'ten bağımsız: HKLM'e yazılan hata ayıklama ilkesi kalmamalı.
          $key = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $left = @(if (Test-Path $key) { (Get-ItemProperty $key).PSObject.Properties.Name | Where-Object { $_ -like 'GolgeDosya*' } })
          $line = "- WebView2 hata ayıklama ilkesi iş sonunda: $(if ($left.Count) { 'KALDI: ' + ($left -join ', ') } else { 'yok' })"
          $line | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          New-Item -ItemType Directory -Force -Path ../../saha-kanit | Out-Null
          $line | Out-File -Append -Encoding utf8 ../../saha-kanit/ilke-temizlik.txt
          if ($left.Count) { throw "Kapı 6: hata ayıklama ilkesi silinmedi" }
          if ($code -ne 0) { throw "Kapı 6: düşen iddia var (çıkış $code)" }

      - name: Saha kanıtı (ekran görüntüleri ve ölçümler)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolgeDosya-windows-saha-kanit
          path: saha-kanit/
          if-no-files-found: warn
          retention-days: 30

      - name: SHA-256 ve SHA256SUMS
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $lines = Get-ChildItem out -File | Where-Object { $_.Name -ne "SHA256SUMS" } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # UTF-8 (BOM'suz) ve LF: `shasum -c` / `sha256sum -c` her platformda
          # okuyabilsin. ASCII kodlama Türkçe dosya adını '?' yapıyor, CRLF ise
          # her satırın sonuna görünmez bir \r ekliyordu.
          [IO.File]::WriteAllText((Join-Path (Resolve-Path out) 'SHA256SUMS'), (($lines -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
          "### SHA-256" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          '```'         | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $lines        | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          '```'         | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GolgeDosya-v0.3.0-windows-x64
          path: out/
          if-no-files-found: error
          retention-days: 30

      # ---------- § Toplu kabul ----------
      - name: KABUL
        if: always()
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $gates = [ordered]@{
            'sürüm tutarlılığı'            = '${{ steps.gate_version.outcome }}'
            'arayüz tip denetimi'          = '${{ steps.gate_tsc.outcome }}'
            'arayüz testleri'              = '${{ steps.gate_front.outcome }}'
            'cargo test --workspace'       = '${{ steps.gate_rust.outcome }}'
            'PDF önizleme (gerçek render)' = '${{ steps.gate_raster.outcome }}'
            'sürüm metadata'               = '${{ steps.meta.outcome }}'
            'portable açılış smoke'        = '${{ steps.smoke_portable.outcome }}'
            'installer kur/çalıştır/kaldır'= '${{ steps.smoke_installer.outcome }}'
            'gerçek pencere (Kapı 6)'      = '${{ steps.gate_field.outcome }}'
          }
          "### Kapılar" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $bad = @()
          foreach ($g in $gates.GetEnumerator()) {
            $mark = if ($g.Value -eq 'success') { 'GECTI' } else { 'DUSTU'; }
            if ($g.Value -ne 'success') { $bad += $g.Key }
            "- $($g.Key): $mark ($($g.Value))" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          if ($bad) { throw "Dusen kapilar: $($bad -join ', ')" }
          "TUM KAPILAR GECTI" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
